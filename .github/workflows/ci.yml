name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, iconv, openssl
          coverage: none
      - name: PHP syntax and regression checks
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/security.php
          php tests/wallet.php
          php tests/bootstrap.php
      - name: JavaScript syntax and release package
        run: |
          node --check assets/blocks.js
          node tests/blocks.js
          python3 tools/security_scan.py
          python3 tools/build.py
  wordpress-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build runtime-only package
        run: |
          python3 tools/build.py
          mkdir -p dist/unpacked
          unzip -q dist/cardraabta-payment-gateway-for-jazzcash-*.zip -d dist/unpacked
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e
        with:
          build-dir: './dist/unpacked/cardraabta-payment-gateway-for-jazzcash'
          slug: 'cardraabta-payment-gateway-for-jazzcash'
          ignore-warnings: false
          ignore-errors: false
  clean-wordpress-debug:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qa-password
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: dom, iconv, mysqli, openssl, zip
          coverage: none
      - name: Install clean WordPress, WooCommerce and release ZIP with WP_DEBUG enabled
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          printf '#!/bin/sh\nexec php /tmp/wp-cli.phar "$@"\n' > /tmp/wp
          chmod +x /tmp/wp
          export PATH="/tmp:$PATH"
          mkdir -p /tmp/agjc-wordpress
          wp core download --version=7.1.3 --path=/tmp/agjc-wordpress --quiet
          wp config create --path=/tmp/agjc-wordpress --dbname=wordpress --dbuser=root --dbpass=qa-password --dbhost=127.0.0.1 --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          PHP
          wp core install --path=/tmp/agjc-wordpress --url=http://localhost --title='Gateway QA' --admin_user=qa --admin_password=qa-password --admin_email=qa@example.test --skip-email
          wp plugin install woocommerce --version=11.2.1 --activate --path=/tmp/agjc-wordpress
          python3 tools/build.py
          wp plugin install "$PWD/dist/cardraabta-payment-gateway-for-jazzcash-1.0.0.zip" --activate --path=/tmp/agjc-wordpress
          wp eval 'if ( ! WP_DEBUG || ! class_exists("AGJC_Gateway") || ! isset(WC()->payment_gateways()->payment_gateways()["jccg_wallet"]) ) { throw new RuntimeException("Clean-install gateway check failed"); }' --path=/tmp/agjc-wordpress
          wp eval '$_SERVER["HTTPS"]="on"; $_SERVER["REQUEST_METHOD"]="GET"; $_GET["wsdl"]="1"; (new AGJC_Gateway())->callback(true);' --path=/tmp/agjc-wordpress > /tmp/agjc-wsdl.xml
          python3 -c 'import xml.etree.ElementTree as E; x=E.parse("/tmp/agjc-wsdl.xml"); assert x.getroot().find(".//{http://schemas.xmlsoap.org/wsdl/soap/}address") is not None'
          if test -f /tmp/agjc-wordpress/wp-content/debug.log; then
            if grep -Ei 'PHP (warning|fatal error|deprecated).*cardraabta-payment-gateway-for-jazzcash' /tmp/agjc-wordpress/wp-content/debug.log; then
              exit 1
            fi
          fi
